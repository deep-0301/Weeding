<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deep & Hinal · Shubh Lagna</title>
<meta name="description" content="With the divine blessings of Shree Swaminarayan Bhagwan, Deep & Hinal warmly invite you to celebrate their wedding.">
<meta name="theme-color" content="#1d0709">
<meta property="og:title" content="Deep & Hinal · Wedding Invitation">
<meta property="og:description" content="With the divine blessings of Shree Swaminarayan Bhagwan, we warmly invite you to celebrate our wedding.">
<meta property="og:image" content="real/photos/DSC01840-s.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="real/flow/md/f000.webp">
<style>
:root{
  color-scheme:dark;
  --kumkum:#7a1420;--kumkum-d:#3d0910;--night:#3d1a19;
  --ivory:#fbf3e4;--ivory-2:#f3e4c8;
  --gold:#d9a84e;--gold-l:#f5d996;--gold-d:#9c6b23;
  --ink:#33160f;--ink-2:#6a3c2a;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-guj:"Noto Serif Gujarati","Shruti",serif;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;font-style:normal!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--ivory);font-family:var(--f-body);font-size:19px;line-height:1.6;font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
html[lang=gu] body{font-family:var(--f-guj),var(--f-body);font-size:17px;font-weight:400;line-height:1.75}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.guj{font-family:var(--f-guj)}
.gold{background:linear-gradient(100deg,#b07a2c 0%,#f8e2a6 28%,#d9a84e 50%,#fff1c6 70%,#b4802f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- top bar: language + music ---------- */
.topbar{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:50;display:flex;gap:8px}
.pill{height:42px;min-width:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(245,217,150,.55);background:rgba(20,5,7,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--gold-l);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:600 13px/1 var(--f-display);letter-spacing:.12em;transition:background .3s,transform .3s}
.pill:hover{background:rgba(122,20,32,.7)}
.pill:active{transform:scale(.96)}
#langBtn .to{font:600 15px/1 var(--f-guj);letter-spacing:0}
html[lang=gu] #langBtn .to{font:600 13px/1 var(--f-display);letter-spacing:.12em}
#langBtn svg,#muBtn svg{width:18px;height:18px;flex:none}
#muBtn{padding:0;width:42px;display:none}
body.entered #muBtn{display:inline-flex}
#muBtn.off .w{display:none}
#muBtn:not(.off) .x{display:none}

/* ---------- walk-in: scroll plays the Kalupur video ---------- */
#walk{position:relative;height:600vh}
#walk .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#1a0c08 url(real/flow/md/f000.webp) center/cover no-repeat}
#film{position:absolute;inset:-6%;width:112%;height:112%;display:block;transform-origin:50% 55%;will-change:transform}
#dust{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
#walk .stick{perspective:900px;perspective-origin:50% 45%}
#walk .names-big,#walk .shubh,#walk .wdate,#walk h2,#walk .eyebrow{filter:drop-shadow(0 3px 18px rgba(25,6,6,.7))}
#walk .ov-mid::before{content:"";position:absolute;inset:-12% -10%;z-index:-1;background:radial-gradient(closest-side,rgba(25,6,6,.42),rgba(25,6,6,0));pointer-events:none}
#walk .ov{z-index:3}
#walk .shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(14,4,5,.42) 0%,rgba(14,4,5,0) 22%,rgba(14,4,5,0) 60%,rgba(14,4,5,.5) 100%)}
.lb{position:absolute;left:0;right:0;height:calc(var(--lb,0) * 8vh);background:#050102;z-index:2;pointer-events:none}
.lb-t{top:0}.lb-b{bottom:0}
@media (orientation:portrait){.lb{height:calc(var(--lb,0) * 4vh)}}
#walk .shade.full{background:rgba(14,4,5,.16);opacity:0;transition:none}
.ov{position:absolute;left:0;right:0;padding:0 max(20px,env(safe-area-inset-left));text-align:center;opacity:0;pointer-events:none;will-change:opacity,transform}
.ov.live{pointer-events:auto}
.ov-top{top:max(70px,calc(env(safe-area-inset-top) + 64px))}
.ov-bot{bottom:max(92px,calc(env(safe-area-inset-bottom) + 84px))}
#ovEnter{bottom:max(40px,calc(env(safe-area-inset-bottom) + 34px))}
.ov-mid{top:50%;transform:translateY(-50%)}
.greet{font:700 clamp(18px,5vw,24px)/1.5 var(--f-guj);color:var(--gold-l);text-shadow:0 2px 14px rgba(0,0,0,.7)}
.greet+.greet{margin-top:2px}
.welcome{max-width:560px;margin:0 auto 22px;font-size:clamp(19px,4.8vw,24px);line-height:1.5;font-weight:600;text-shadow:0 2px 16px rgba(0,0,0,.85)}
html[lang=gu] .welcome{font-size:clamp(16px,4.3vw,20px);font-weight:500}
.btn-gold{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 30px;border-radius:999px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#fbe7ad 0%,#e1b25a 46%,#b98330 100%);color:#3d0910;font:700 14px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,236,180,.6) inset,0 0 0 4px rgba(217,168,78,.25);transition:transform .3s var(--ease),box-shadow .3s}
html[lang=gu] .btn-gold{font:700 16px/1.2 var(--f-guj);letter-spacing:.02em;text-transform:none}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,236,180,.7) inset,0 0 0 6px rgba(217,168,78,.3)}
.btn-gold::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:1px solid rgba(245,217,150,.6);animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}
.hint{margin-top:16px;font:600 12px/1.4 var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:rgba(251,243,228,.8)}
html[lang=gu] .hint{font:500 14px/1.5 var(--f-guj);letter-spacing:.02em;text-transform:none}
.eyebrow{display:block;font:600 13px/1.5 var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
html[lang=gu] .eyebrow{font:600 16px/1.5 var(--f-guj);letter-spacing:.03em;text-transform:none}
.ov h2{font:600 clamp(30px,8.4vw,60px)/1.12 var(--f-display);letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,0,.75);text-wrap:balance}
html[lang=gu] .ov h2{font:700 clamp(28px,8vw,54px)/1.3 var(--f-guj)}
.ov p.sub{max-width:620px;margin:10px auto 0;font-size:clamp(19px,4.8vw,25px);font-weight:600;text-shadow:0 2px 18px rgba(0,0,0,.85);text-wrap:balance}
html[lang=gu] .ov p.sub{font-size:clamp(16px,4.3vw,21px);font-weight:500}
.names-big{font:600 clamp(54px,16vw,128px)/1 var(--f-display);letter-spacing:.02em;text-shadow:none;filter:drop-shadow(0 6px 26px rgba(0,0,0,.7))}
html[lang=gu] .names-big{font:700 clamp(52px,15vw,120px)/1.15 var(--f-guj)}
.names-big .amp{display:block;font-size:.42em;line-height:1.3;color:var(--gold-l);-webkit-text-fill-color:var(--gold-l)}
.shubh{font:700 clamp(17px,4.4vw,22px)/1.4 var(--f-guj);color:var(--gold-l);margin-bottom:10px}
.wdate{margin-top:14px;font:600 clamp(13px,3.6vw,17px)/1.6 var(--f-display);letter-spacing:.24em;color:var(--gold-l);text-transform:uppercase}
html[lang=gu] .wdate{font:600 clamp(15px,4vw,19px)/1.6 var(--f-guj);letter-spacing:.02em}
.wbar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--gold-d),var(--gold-l))}
.scrollcue{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font:600 11px/1 var(--f-display);letter-spacing:.3em;color:rgba(251,243,228,.85);opacity:0;transition:opacity .6s}
html[lang=gu] .scrollcue{font:500 13px/1.3 var(--f-guj);letter-spacing:.02em}
.scrollcue i{width:1px;height:34px;background:linear-gradient(var(--gold-l),transparent);animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:0 0}50%{transform:scaleY(1);transform-origin:0 0}51%{transform-origin:0 100%}100%{transform:scaleY(0);transform-origin:0 100%}}
body.entered .scrollcue.on{opacity:1}

/* ---------- shared section bits ---------- */
section{position:relative}
.pad{padding:clamp(80px,12vw,140px) max(20px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto;position:relative}
.h-sec{font:600 clamp(32px,8vw,58px)/1.15 var(--f-display);letter-spacing:.02em;text-wrap:balance}
html[lang=gu] .h-sec{font:700 clamp(28px,7.4vw,50px)/1.35 var(--f-guj)}
.rule{display:block;width:120px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.center{text-align:center}
.ivory{background:linear-gradient(180deg,var(--ivory),var(--ivory-2));color:var(--ink)}
.ivory .eyebrow{color:var(--gold-d)}
.ivory .h-sec{color:var(--kumkum)}
.rv{opacity:0;transform:translateY(34px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}
.ph{position:relative;overflow:hidden;background:#2a0d0d}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.14);transition:transform 1.8s var(--ease)}
.ph.rv{opacity:1;transform:none;clip-path:inset(14% 10% 14% 10% round 4px);transition:clip-path 1.4s var(--ease)}
.ph.rv.in{clip-path:inset(0 0 0 0 round 4px)}
.ph.rv.in img{transform:scale(1.02)}

/* ---------- couple ---------- */
#couple .grid{display:grid;grid-template-columns:1fr;gap:44px;align-items:center}
#couple .ph{aspect-ratio:2/3;max-width:460px;width:100%;margin:0 auto;border-radius:4px;box-shadow:0 30px 80px -30px rgba(61,9,16,.55)}
#couple .frame{position:relative;max-width:460px;margin:0 auto;width:100%}
#couple .frame::before{content:"";position:absolute;inset:-14px;border:1px solid rgba(156,107,35,.55);border-radius:6px;pointer-events:none}
.person{text-align:center}
.person .pre{font:600 13px/1.4 var(--f-display);letter-spacing:.28em;color:var(--gold-d);text-transform:uppercase}
html[lang=gu] .person .pre{font:600 16px/1.4 var(--f-guj);letter-spacing:0;text-transform:none}
.person .nm{font:600 clamp(46px,12vw,76px)/1.1 var(--f-display);color:var(--kumkum)}
html[lang=gu] .person .nm{font:700 clamp(44px,11vw,70px)/1.3 var(--f-guj)}
.person .of{margin-top:4px;color:var(--ink-2);font-size:19px}
.amp-sm{display:block;text-align:center;margin:20px 0;font:600 30px/1 var(--f-display);color:var(--gold)}
@media (min-width:880px){#couple .grid{grid-template-columns:1fr 1.05fr;gap:80px}}

/* ---------- full-bleed photo with words ---------- */
.bleed{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;text-align:center}
.bleed .bg{position:absolute;inset:-12% 0;will-change:transform}
.bleed .bg img{width:100%;height:100%;object-fit:cover}
.bleed::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 50%,rgba(14,4,5,.25),rgba(14,4,5,.72))}
.bleed .inner{position:relative;z-index:2;padding:0 max(22px,env(safe-area-inset-left));max-width:900px}
.quote{font:600 clamp(28px,7.4vw,56px)/1.25 var(--f-display);letter-spacing:.01em;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.7)}
html[lang=gu] .quote{font:600 clamp(24px,6.6vw,46px)/1.55 var(--f-guj)}
.bleed .by{margin-top:18px;font:600 14px/1.4 var(--f-display);letter-spacing:.32em;color:var(--gold-l);text-transform:uppercase}
html[lang=gu] .bleed .by{font:600 17px/1.4 var(--f-guj);letter-spacing:.02em}

/* ---------- gallery: vertical scroll moves the film strip sideways ---------- */
#gallery{position:relative;height:var(--gh,420vh);background:var(--night)}
#gallery .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
#gallery .head{padding:0 max(20px,env(safe-area-inset-left));margin-bottom:clamp(18px,3vh,34px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
#gallery .head .h-sec{color:var(--ivory)}
#gallery .count{font:600 14px/1 var(--f-display);letter-spacing:.2em;color:var(--gold)}
.track{display:flex;gap:clamp(14px,2.4vw,28px);padding:0 max(20px,env(safe-area-inset-left));will-change:transform}
.track figure{flex:none;height:min(64vh,640px);overflow:hidden;border-radius:4px;position:relative;background:#2a0d0d}
.track figure.p{aspect-ratio:2/3}.track figure.l{aspect-ratio:3/2}
.track img{width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
.gal-bar{margin:clamp(18px,3vh,30px) max(20px,env(safe-area-inset-left)) 0;height:1px;background:rgba(217,168,78,.25);position:relative}
.gal-bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(0);background:var(--gold-l)}
@media (max-width:760px){.track figure{height:56vh}.track figure.l{height:34vh;align-self:center}}

/* ---------- date + countdown ---------- */
#date .inner{max-width:760px}
.scratch{position:relative;max-width:620px;margin:16px auto 6px;border-radius:18px;overflow:hidden;
  box-shadow:0 30px 60px -24px rgba(0,0,0,.7),0 0 0 1px rgba(245,217,150,.6),inset 0 0 0 6px rgba(20,5,7,.25)}
.sc-face{padding:clamp(26px,5vw,40px) 16px clamp(22px,4vw,34px);background:radial-gradient(120% 100% at 50% 0%,rgba(90,22,28,.85),rgba(30,8,10,.92))}
.sc-face .big-date{margin:0 0 8px}
.sc-foil{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;transition:opacity .9s}
.scratch.done .sc-foil{opacity:0;pointer-events:none}
.sc-hide{opacity:0!important;visibility:hidden;transition:opacity .8s,visibility 0s .8s}
.revealed .sc-hide{opacity:1!important;visibility:visible;transition:opacity .8s .3s}
.big-date{font:600 clamp(40px,11vw,92px)/1.08 var(--f-display);letter-spacing:.02em;margin:10px 0 6px}
html[lang=gu] .big-date{font:700 clamp(36px,10vw,80px)/1.3 var(--f-guj)}
.muh{font:600 clamp(16px,4.2vw,21px)/1.5 var(--f-display);letter-spacing:.16em;color:var(--gold-l);text-transform:uppercase}
html[lang=gu] .muh{font:600 clamp(17px,4.4vw,22px)/1.6 var(--f-guj);letter-spacing:.02em}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,18px);max-width:560px;margin:34px auto 30px}
.cd div{padding:16px 4px 12px;border:1px solid rgba(245,217,150,.45);border-radius:6px;background:rgba(20,5,7,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cd b{display:block;font:600 clamp(28px,8vw,48px)/1 var(--f-display);color:var(--ivory)}
html[lang=gu] .cd b{font:600 clamp(26px,7.4vw,44px)/1.1 var(--f-guj)}
.cd span{display:block;margin-top:8px;font:600 11px/1.2 var(--f-display);letter-spacing:.2em;color:var(--gold-l);text-transform:uppercase}
html[lang=gu] .cd span{font:500 14px/1.3 var(--f-guj);letter-spacing:0}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid currentColor;background:transparent;cursor:pointer;text-decoration:none;font:600 13px/1.2 var(--f-display);letter-spacing:.16em;text-transform:uppercase;transition:background .3s,color .3s}
html[lang=gu] .btn-line{font:600 16px/1.2 var(--f-guj);letter-spacing:.01em;text-transform:none}
.btn-line svg{width:17px;height:17px}
.bleed .btn-line{color:var(--gold-l)}
.bleed .btn-line:hover{background:var(--gold-l);color:#3d0910}
.ivory .btn-line{color:var(--kumkum)}
.ivory .btn-line:hover{background:var(--kumkum);color:var(--ivory)}

/* ---------- events ---------- */
.ev-grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:46px}
@media (min-width:700px){.ev-grid{grid-template-columns:1fr 1fr}}
@media (min-width:1040px){.ev-grid{grid-template-columns:1fr 1fr 1fr}}
.ev{position:relative;background:#fffaf0;border-radius:6px;padding:30px 26px 26px;box-shadow:0 1px 0 rgba(156,107,35,.25),0 24px 50px -30px rgba(61,9,16,.45);border-top:3px solid var(--gold);text-align:center}
.ev .no{font:600 13px/1 var(--f-display);letter-spacing:.3em;color:var(--gold-d)}
.ev h3{margin:10px 0 2px;font:600 clamp(26px,6vw,32px)/1.2 var(--f-display);color:var(--kumkum)}
html[lang=gu] .ev h3{font:700 clamp(24px,5.6vw,30px)/1.4 var(--f-guj)}
.ev .when{margin-top:10px;font:600 14px/1.6 var(--f-display);letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
html[lang=gu] .ev .when{font:600 16px/1.6 var(--f-guj);letter-spacing:0;text-transform:none}
.ev .where{margin-top:6px;color:var(--ink-2)}
.ev .dress{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);font-size:16px}
.ev .dress b{font-weight:700;color:var(--ink)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.ev .btn-line{margin-top:18px;min-height:42px;padding:0 18px;font-size:12px}
html[lang=gu] .ev .btn-line{font-size:15px}

/* ---------- venue ---------- */
#venue .bg img{filter:saturate(1.05)}
.v-name{font:600 clamp(30px,8vw,54px)/1.2 var(--f-display);margin:8px 0 6px}
html[lang=gu] .v-name{font:700 clamp(28px,7.4vw,48px)/1.4 var(--f-guj)}
.v-addr{font-size:clamp(18px,4.6vw,22px);color:#f3e2c4;margin-bottom:26px}
.map{margin:26px auto 0;max-width:720px;aspect-ratio:16/9;border:1px solid rgba(245,217,150,.4);border-radius:6px;overflow:hidden}
.map iframe{width:100%;height:100%;border:0}

/* ---------- family ---------- */
.fam{display:grid;grid-template-columns:1fr;gap:26px;margin-top:40px}
@media (min-width:760px){.fam{grid-template-columns:1fr 1fr}}
.fam .card{background:#fffaf0;border-radius:6px;padding:28px 24px;text-align:center;box-shadow:0 24px 50px -32px rgba(61,9,16,.45)}
.fam h3{font:600 15px/1.4 var(--f-display);letter-spacing:.26em;color:var(--gold-d);text-transform:uppercase;margin-bottom:12px}
html[lang=gu] .fam h3{font:700 19px/1.4 var(--f-guj);letter-spacing:0;text-transform:none;color:var(--kumkum)}
.fam li{list-style:none;padding:6px 0;border-bottom:1px solid rgba(156,107,35,.18);color:var(--ink)}
.fam li:last-child{border:0}
.fam-photo{margin-top:56px;aspect-ratio:3/2;border-radius:4px}
@media (max-width:760px){.fam-photo{aspect-ratio:4/5}}

/* ---------- RSVP ---------- */
#rsvp .grid{display:grid;grid-template-columns:1fr;gap:40px;align-items:center}
@media (min-width:880px){#rsvp .grid{grid-template-columns:.9fr 1.1fr;gap:70px}}
#rsvp .ph{aspect-ratio:2/3;border-radius:4px;max-width:440px;width:100%;margin:0 auto}
form{display:grid;gap:16px;background:#fffaf0;border-radius:6px;padding:30px 24px;box-shadow:0 24px 50px -30px rgba(61,9,16,.45)}
label.f,span.f{display:grid;gap:6px;font:600 12px/1.4 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
html[lang=gu] label.f,html[lang=gu] span.f{font:600 15px/1.4 var(--f-guj);letter-spacing:0;text-transform:none}

function fmtTime(hhmm){ const [h, m] = hhmm.split(':').map(Number);
  if (LANG === 'gu') { const part = h < 12 ? 'સવારે' : h < 16 ? 'બપોરે' : h < 19 ? 'સાંજે' : 'રાત્રે'; const h12 = ((h + 11) % 12) + 1; return part + ' ' + num(h12) + ':' + num(String(m).padStart(2, '0')); }
  const h12 = ((h + 11) % 12) + 1; return h12 + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); }

/* ---------- the walk-in film: scroll scrubs the Kalupur video, frame by frame ---------- */

  const order = [], seen = new Set(), push = k => { if (k < frames.length && !seen.has(k)) { seen.add(k); order.push(k); } };
  push(0); for (const g of [8, 4, 2, 1]) for (let k = 0; k < frames.length; k += g) push(k);
  let at = 0, live = 0; const MAX = 6;
  const next = () => { while (live < MAX && at < order.length) { const k = order[at++], im = new Image(); live++; im.decoding = 'async';
      im.onload = () => { im.ok = true; live--; if (k === 0 || Math.abs(k - Math.round(curF)) < 3) { drawn = -1; draw(Math.round(curF)); } next(); };
      im.onerror = () => { live--; next(); }; im.src = `real/${SET}/f${String(frames[k]).padStart(3, '0')}.webp`; imgs[k] = im; } };
  next();
})();

const walk = $('#walk'), ovs = $$('#walk .ov'), shadeFull = $('#shadeFull'), wbar = $('#wbar'), cue = $('#cue') || document.createElement('i');

  if (REDUCE) curF = tgtF;
  wbar.style.transform = `scaleX(${walkP})`;
  shadeFull.style.opacity = Math.max(0, (walkP - .74) / .2).toFixed(3);
  { const sm = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }; walk.style.setProperty('--lb', (sm((walkP - .2) / .12) * (1 - sm((walkP - .9) / .1))).toFixed(3)); }
  cue.classList.toggle('on', walkP > .02 && walkP < .97);

    else { const len = b - a, f = (walkP - a) / len; v = f < 0 || f > 1 ? 0 : Math.min(1, f / .22, (1 - f) / .22); y = (1 - Math.min(1, Math.max(0, f / .22))) * 40 - Math.max(0, (f - .78) / .22) * 30; }
    o.style.opacity = Math.max(0, Math.min(1, v)).toFixed(3);
    let zz = 0;
    if (!REDUCE) { if (hold) zz = (1 - v) * 260; else { const f2 = (walkP - a) / (b - a); zz = f2 < .22 ? -320 * (1 - Math.max(0, f2) / .22) : f2 > .78 ? 260 * Math.min(1, (f2 - .78) / .22) : 0; } }

  $('#galBar').style.transform = `scaleX(${gp})`;
  const n = CONFIG.gallery.length, idx = Math.min(n, 1 + Math.floor(gp * n));

    el.style.transform = `perspective(1200px) translate3d(0,0,${(-Math.abs(c) * 220).toFixed(0)}px) rotateX(${(c * -16).toFixed(2)}deg)`;

/* ---------- 3D depth on the walk-in: the camera sways and tilts, golden dust drifts past ---------- */
let px3 = 0, py3 = 0, qx3 = 0, qy3 = 0;
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { qx3 = e.clientX / innerWidth * 2 - 1; qy3 = e.clientY / innerHeight * 2 - 1; } }, { passive: true });
addEventListener('deviceorientation', e => { if (e.gamma != null) { qx3 = Math.max(-1, Math.min(1, e.gamma / 25)); qy3 = Math.max(-1, Math.min(1, (e.beta - 50) / 25)); } });

fitDust(); addEventListener('resize', fitDust);

/* ---------- 360 journey: scroll carries you through the five views ---------- */

  const embed = v => `https://www.google.com/maps/embed?pb=!4v1731280000000!6m8!1m7!1s${v.pano}!2m2!1d${v.lat}!2d${v.lng}!3f${v.heading}!4f${v.pitch}!5f0.7820865974627469`;

  document.addEventListener('securitypolicyviolation', e => { if (/frame/.test(e.violatedDirective || e.effectiveDirective || '')) { blocked = true; layers.forEach((o, k) => unmount(k)); } });
  function mount(i){ const o = layers[i]; if (!o || o.f || sv || blocked) return; const f = document.createElement('iframe'); f.src = embed(o.v); f.title = '360 view, Shree Swaminarayan Mandir, Kalupur';
    f.loading = 'eager'; f.referrerPolicy = 'no-referrer-when-downgrade'; f.tabIndex = -1; f.addEventListener('load', () => setTimeout(() => f.classList.add('on'), 600)); o.el.appendChild(f); o.f = f; }
  function unmount(i){ const o = layers[i]; if (o && o.f) { o.f.remove(); o.f = null; } }

      const box = document.createElement('div'); box.className = 't-layer sv'; stage.appendChild(box); layers.forEach(o => o.el.style.display = 'none');
      sv = new google.maps.StreetViewPanorama(box, { pano: TV[0].pano, pov: { heading: TV[0].heading, pitch: TV[0].pitch }, zoom: 0, disableDefaultUI: true, clickToGo: false,
        linksControl: false, scrollwheel: false, motionTracking: false, motionTrackingControl: false, showRoadLabels: false });

/* ---------- scratch card: the guest rubs the gold foil to reveal the date ---------- */

    // brushed gold foil
    const lg = g.createLinearGradient(0, 0, W, H);
    lg.addColorStop(0, '#b8862f'); lg.addColorStop(.22, '#f6dc96'); lg.addColorStop(.42, '#c99a43'); lg.addColorStop(.6, '#fbe7ad'); lg.addColorStop(.8, '#b98330'); lg.addColorStop(1, '#e8c272');
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H / 60; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(255,248,220,.10)' : 'rgba(90,55,10,.08)'; g.fillRect(Math.random() * W, Math.random() * H, Math.random() * 30 + 4, 1); }
    const sh = g.createLinearGradient(0, 0, W, 0); sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(.5, 'rgba(255,255,240,.28)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(110,64,12,.55)'; g.lineWidth = 1.5; g.strokeRect(10, 10, W - 20, H - 20);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#5a1418';
    const big = Math.max(18, Math.min(30, W / 17));
    g.font = `700 ${big}px ${LANG === 'gu' ? '"Noto Serif Gujarati",serif' : '"Cinzel",Georgia,serif'}`;
    g.fillText(T[LANG].scratch, W / 2, H / 2 - big * .35);
    g.font = `500 ${Math.round(big * .55)}px ${LANG === 'gu' ? '"Noto Serif Gujarati",serif' : 'Georgia,serif'}`; g.fillStyle = 'rgba(90,20,24,.75)';
    g.fillText('✦  ' + T[LANG].scratchHint + '  ✦', W / 2, H / 2 + big * .75);
    fc.setAttribute('aria-label', T[LANG].scratch);
    CW = Math.ceil(W / GRID); CH = Math.ceil(H / GRID); cells = new Uint8Array(CW * CH); scratched = 0;
  };
  function rub(x, y){
    const R = Math.max(22, Math.min(40, W / 14));
    g.globalCompositeOperation = 'destination-out'; g.lineCap = 'round'; g.lineWidth = R * 2;
    g.beginPath(); g.moveTo(lx, ly); g.lineTo(x, y); g.stroke();
    g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2); g.fill();
    // count cleared area on a coarse grid along the stroke
    const steps = Math.max(1, Math.ceil(Math.hypot(x - lx, y - ly) / (R / 2)));
    for (let k = 0; k <= steps; k++) { const cx = lx + (x - lx) * k / steps, cy = ly + (y - ly) * k / steps;
      for (let gy = Math.floor((cy - R) / GRID); gy <= Math.floor((cy + R) / GRID); gy++) for (let gx = Math.floor((cx - R) / GRID); gx <= Math.floor((cx + R) / GRID); gx++) {
        if (gx < 0 || gy < 0 || gx >= CW || gy >= CH) continue; const mx = gx * GRID + GRID / 2, my = gy * GRID + GRID / 2;
        if (Math.hypot(mx - cx, my - cy) < R && !cells[gy * CW + gx]) { cells[gy * CW + gx] = 1; scratched++; } } }
    lx = x; ly = y;
    if (scratched / (CW * CH) > .45) reveal();
  }
  function reveal(){ if (done) return; done = true; box.classList.add('done'); sec.classList.add('revealed'); if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {} }
  const pos = e => { const r = fc.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  fc.addEventListener('pointerdown', e => { if (done) return; down = true; fc.setPointerCapture(e.pointerId); [lx, ly] = pos(e); rub(lx, ly); e.preventDefault(); });
  fc.addEventListener('pointermove', e => { if (!down || done) return; const [x, y] = pos(e); rub(x, y); e.preventDefault(); });
  const up = () => { down = false; }; fc.addEventListener('pointerup', up); fc.addEventListener('pointercancel', up);
  fc.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') reveal(); }); fc.tabIndex = 0;
  if (REDUCE) { /* still a card to tap: one tap reveals */ fc.addEventListener('click', reveal); }
  addEventListener('resize', () => { if (!done) paintFoil(); });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => paintFoil());
  paintFoil();
})();

/* ---------- start ---------- */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0, 0);
applyLang();
$$('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
fitCanvas(); sizeGallery(); onScroll(); requestAnimationFrame(loop);
addEventListener('load', () => { sizeGallery(); onScroll(); });
</script>
<script>
/* ================= FULL 3D: the walk-in film lives on a plane in a 3D space; you step through it
   into four chapters of your real photographs. In each chapter the photos come to the centre one by one
   and sweep aside as you pass; the invitation sections float in the open stretches between chapters.
   three.js r128 from cdnjs. Without WebGL the page shows the chapters as simple photo grids. ================= */
(function(){
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  sc.crossOrigin = 'anonymous';
  sc.onload = () => { try { init(); } catch (e) { console.warn('3D off', e); document.body.classList.remove('w3d'); window.W3D = null; } };
  document.head.appendChild(sc);

  function init(){
    if (!window.THREE) return;
    const cv = document.getElementById('three');
    let R; try { R = new THREE.WebGLRenderer({ canvas: cv, antialias: !PHONE, alpha: false, powerPreference: 'high-performance' }); } catch (e) { return; }
    if (!R.getContext()) return;
    const GL2 = R.capabilities.isWebGL2;
    R.setPixelRatio(Math.min(devicePixelRatio || 1, PHONE ? 1.75 : 2));
    R.outputEncoding = THREE.sRGBEncoding;
    const BG = 0x3d1a19;
    const scene = new THREE.Scene(); scene.background = new THREE.Color(BG); scene.fog = new THREE.FogExp2(BG, PHONE ? .032 : .028);
    const cam = new THREE.PerspectiveCamera(50, 1, .05, 220);
    const D = 10;
    const tex = t => { t.encoding = THREE.sRGBEncoding; t.generateMipmaps = GL2; t.minFilter = GL2 ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter; t.anisotropy = Math.min(4, R.capabilities.getMaxAnisotropy()); return t; };

    // ---- the walk-in film ----
    const filmTex = tex(new THREE.Texture()); filmTex.generateMipmaps = false; filmTex.minFilter = THREE.LinearFilter;
    const filmMat = new THREE.MeshBasicMaterial({ map: filmTex, transparent: true, fog: false, depthWrite: false });
    const film = new THREE.Mesh(new THREE.PlaneGeometry(16, 9), filmMat); film.renderOrder = 10; scene.add(film);
    let filmShown = -1, filmCover = 1;

    // ---- framed photographs ----
    const frameMat = new THREE.MeshBasicMaterial({ color: 0xc9a254 });
    const matte = new THREE.MeshBasicMaterial({ color: 0xf6ead2 });
    const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 10, 64, 64, 64);
      r.addColorStop(0, 'rgba(0,0,0,.75)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
    const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: .8 });
    const loader = new THREE.TextureLoader();
    const photos = [];
    function framed(n, o, h){
      const w = o === 'p' ? h * 2 / 3 : h * 3 / 2, g = new THREE.Group();
      const sh = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.5, h * 1.4), shadowMat); sh.position.set(.25, -.3, -.06); g.add(sh);
      const fr = new THREE.Mesh(new THREE.PlaneGeometry(w + .16, h + .16), frameMat); fr.position.z = -.03; g.add(fr);
      const mt = new THREE.Mesh(new THREE.PlaneGeometry(w + .07, h + .07), matte); mt.position.z = -.015; g.add(mt);
      const ph = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0x2a0d0d })); g.add(ph);
      g.userData = { n, ph, w, loaded: false, ph0: Math.random() * 6 }; scene.add(g); photos.push(g); return g;
    }

    // ---- lay the journey out along -z, one stretch per section ----
    const secs = [...document.querySelectorAll('body > section')].filter(s => s.id !== 'walk' && s.id !== 'gallery' && s.id !== 'tour');
    const GAP = PHONE ? 7 : 7.5, PANEL = 7;
    let z = -1.5; const SEQ = [];
    for (const el of secs) {
      const ch = el.dataset.ch != null ? CONFIG.chapters[+el.dataset.ch] : null, z0 = z;
      if (ch) {
        ch.photos.forEach(([n, o], k) => {
          const side = k % 2 ? 1 : -1, h = o === 'p' ? (PHONE ? 3.5 : 5.2) : (PHONE ? 2.35 : 3.9);
          const g = framed(n, o, h), pz = z - 6 - k * GAP;
          g.userData.side = side; g.userData.home = new THREE.Vector3(side * (PHONE ? .12 : .9), (PHONE ? .25 : -.35) + Math.sin(k * 1.7) * .2, pz);
          g.userData.tilt = Math.sin(k * 2.3) * .04; g.position.copy(g.userData.home);
        });
        z = z - 6 - (ch.photos.length - 1) * GAP - 5.5;
      } else z -= PANEL;
      SEQ.push({ el, z0, z1: z });
    }
    // the last photograph waits at the end, facing you
    const endP = framed(CONFIG.endPhoto, 'l', PHONE ? 3 : 5.6);
    endP.userData.home = new THREE.Vector3(0, .35, z - 7); endP.position.copy(endP.userData.home); endP.userData.fixed = true;
    SEQ[SEQ.length - 1].z1 = z - 7 + (PHONE ? 8.5 : 9.5);

    // ---- warm bokeh ----
    const bok = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, 'rgba(255,226,160,.9)'); r.addColorStop(.55, 'rgba(255,196,110,.35)'); r.addColorStop(.8, 'rgba(255,180,90,.12)'); r.addColorStop(1, 'rgba(255,170,80,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
    const BN = PHONE ? 300 : 600, bp = new Float32Array(BN * 3), depth = Math.abs(z) + 20;
    for (let i = 0; i < BN; i++) { bp[i * 3] = (Math.random() - .5) * 22; bp[i * 3 + 1] = (Math.random() - .5) * 12; bp[i * 3 + 2] = 4 - Math.random() * depth; }
    const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.BufferAttribute(bp, 3));
    const bokeh = new THREE.Points(bg, new THREE.PointsMaterial({ size: PHONE ? .32 : .26, map: bok, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(bokeh);

    // ---- scroll → camera depth (piecewise, so each chapter plays while its section is on screen) ----
    const walkEl = document.getElementById('walk');
    let KEYS = [], keysAt = 0;
    function buildKeys(){
      const vh = innerHeight, walkEnd = walkEl.offsetTop + walkEl.offsetHeight - vh;
      KEYS = [[walkEnd, D]];
      for (const s of SEQ) { const top = s.el.offsetTop, h = s.el.offsetHeight;
        KEYS.push([Math.max(walkEnd + 1, top - vh * .5), s.z0], [top + h - vh * .5, s.z1]); }
    }
    function zAt(y){
      if (y <= KEYS[0][0]) return D;
      for (let i = 1; i < KEYS.length; i++) if (y <= KEYS[i][0]) { const [a, za] = KEYS[i - 1], [b, zb] = KEYS[i]; const f = b > a ? (y - a) / (b - a) : 1; return za + (zb - za) * f; }
      return KEYS[KEYS.length - 1][1];
    }

    function resize(){
      const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.fov = w < h ? 60 : 50; cam.updateProjectionMatrix();
      const Hv = 2 * D * Math.tan(cam.fov * Math.PI / 360), Wv = Hv * cam.aspect; filmCover = Math.max(Wv / 16, Hv / 9) * 1.06; buildKeys();
    }
    resize(); addEventListener('resize', resize); addEventListener('load', buildKeys);

    let mx = 0, my = 0, tx = 0, ty = 0;
    addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; } }, { passive: true });
    addEventListener('deviceorientation', e => { if (e.gamma != null) { tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, (e.beta - 50) / 30)); } });

    let camZ = D, t = 0, last = performance.now(), n = 0;
    const smooth = x => x * x * (3 - 2 * x);
    window.W3D = {
      relayout: buildKeys,
      frame(k){
        const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
        if (++n % 45 === 0) buildKeys();
        const j = nearestLoaded(k);
        if (j >= 0 && j !== filmShown && imgs[j] && walkP > .9) { filmTex.image = imgs[j]; filmTex.needsUpdate = true; filmShown = j; }
        const target = zAt(scrollY);
        camZ += (target - camZ) * (REDUCE ? 1 : Math.min(1, dt * 5));
        mx += (tx - mx) * Math.min(1, dt * 2.5); my += (ty - my) * Math.min(1, dt * 2.5);
        film.scale.setScalar(filmCover);
        const through = Math.min(1, Math.max(0, (D - camZ) / (D - 1)));
        filmMat.opacity = 1 - through * through; film.visible = filmShown >= 0 && filmMat.opacity > .01;
        const inside = camZ < D - .01;
        cam.position.set(mx * (inside ? .45 : .1), -my * (inside ? .28 : .06), camZ);
        cam.lookAt(mx * (inside ? .8 : .04), -my * (inside ? .35 : .03), camZ - 10);
        if (inside && !REDUCE) cam.rotateZ(Math.sin(camZ * .12) * .035);
        for (const g of photos) { const u = g.userData, dz = u.home.z - camZ;
          if (!u.loaded && dz > -55 && dz < 10) { u.loaded = true; loader.load(`real/photos/${u.n}-s.webp`, tt => { tex(tt); u.ph.material.dispose(); u.ph.material = new THREE.MeshBasicMaterial({ map: tt }); }); }
          if (u.fixed) { g.position.y = u.home.y + (REDUCE ? 0 : Math.sin(t * .5) * .05); continue; }
          // ahead: waits near the centre; as you reach it, it sweeps aside and turns away
          const d = -dz, a = smooth(Math.min(1, Math.max(0, (7.5 - d) / 6.5)));
          const out = u.side * ((PHONE ? 3.6 : 5.4) + u.w * .3) * a;
          g.position.set(u.home.x + out, u.home.y + (REDUCE ? 0 : Math.sin(t * .6 + u.ph0) * .07) + a * .2, u.home.z);
          g.rotation.set(REDUCE ? 0 : Math.sin(t * .4 + u.ph0) * .06, -u.side * (.2 + a * 1.25), u.tilt * (1 - a) + (REDUCE ? 0 : Math.sin(t * .3 + u.ph0) * .02));
        }
        bokeh.rotation.z = Math.sin(t * .05) * .03; bokeh.position.y = Math.sin(t * .3) * .2;
        R.render(scene, cam);
      }
    };
    document.body.classList.add('w3d');
    requestAnimationFrame(buildKeys);
  }
})();

</script>
