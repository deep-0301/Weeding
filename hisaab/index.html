let state;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.expenses)) { if (p.sample) return sampleState(); return normalize(p); } } } catch(e) {}
  return sampleState();
}
function normalize(p){
  const base = freshState();
  let cats = Array.isArray(p.categories) && p.categories.length ? p.categories.map(c => Object.assign({budget:0, gu:GU_CATS[c.id]||""}, c)) : base.categories;
  return {
    version:2, sample:!!p.sample,
    settings:Object.assign(base.settings, p.settings||{}),
    categories: cats,
    expenses: (p.expenses||[]).map(x => Object.assign({id:uid(),notes:"",due:""}, x, {amount:+x.amount||0, paid:+x.paid||0})),
    vyavhar: (p.vyavhar||[]).map(x => Object.assign({id:uid(),notes:"",item:""}, x, {amount:+x.amount||0}))
  };
}
let saveWarned = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e) { if (!saveWarned) { saveWarned = true; toast("This browser is not saving data. Export a backup from Setup & Export."); } }
}
state = load();

const cat = id => state.categories.find(c => c.id === id) || {id, en:"(removed category)", budget:0};
const side = id => SIDES.find(s => s.id === id) || SIDES[2];
function statusOf(x){
  const amt = +x.amount||0, paid = +x.paid||0;
  if (amt > 0 && paid >= amt) return {k:"paid", t:"Paid"};
  if (x.due && x.due < today()) return {k:"overdue", t:"Overdue"};
  if (paid > 0) return {k:"partial", t:"Advance paid"};
  return {k:"pending", t:"Pending"};
}
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x)||0), 0);
function totals(list = state.expenses){
  const amount = sum(list, x => x.amount), paid = sum(list, x => Math.min(x.paid, x.amount || x.paid));
  return {amount, paid, due: Math.max(0, amount - paid)};
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

function renderHeader(){
  const {bride, groom, date} = state.settings;
  $("#hdrTitle").innerHTML = `${esc(groom || "Groom")} &amp; ${esc(bride || "Bride")}` + (groom === "Deep" && bride === "Hinal" ? ` <span class="gu">દીપ &amp; હિનલ</span>` : "");
  $("#hdrSub").textContent = (lang === "gu" ? "વરપક્ષ ખર્ચ · લગ્ન હિસાબ" : "Groom side expenses · Lagna Hisaab") + (date ? " · " + fmtDate(date) : "");
  const cd = $("#countdown");
  if (date) {
    const days = Math.round((new Date(date + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5);
    cd.innerHTML = days > 0 ? `<b class="num">${days}</b> ${T("days to shubh lagna")}` : days === 0 ? `<b>${T("Today")}</b> ${T("shubh lagna")}` : `<b class="num">${-days}</b> ${T("days since lagna")}`;
  } else cd.innerHTML = "";
}

const VIEWS = {overview:renderOverview, expenses:renderExpenses, setup:renderSetup};

function route(){
  let v = (location.hash || "").slice(1);
  if (!VIEWS[v]) v = "overview";
  document.documentElement.lang = lang;
  document.querySelectorAll("nav.tabs a").forEach(a => { a.textContent = T(a.dataset.en || (a.dataset.en = a.textContent)); });
  const lb = $("#langBtn"); if (lb) lb.textContent = lang === "gu" ? "English" : "ગુજરાતી";
  document.querySelectorAll("nav.tabs a").forEach(a => { if (a.getAttribute("href") === "#" + v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderHeader();
  $("#main").innerHTML = "";
  const sec = document.createElement("section"); sec.className = "view"; $("#main").appendChild(sec);
  if (state.sample) sec.insertAdjacentHTML("beforeend", `<div class="notice"><span><b>${T("These are example entries")}</b> ${T("so you can see how the book works. Clear them when you are ready to add your own.")}</span><span class="toolbar"><button class="btn small primary" id="clearSample">${T("Clear examples and start")}</button><button class="btn small" id="keepSample">${T("Keep examples")}</button></span></div>`);
  VIEWS[v](sec);
  const cs = $("#clearSample"); if (cs) cs.onclick = () => { const s = freshState(); s.settings = state.settings; state = s; save(); route(); toast(T("Examples cleared. Add your first expense.")); };
  const ks = $("#keepSample"); if (ks) ks.onclick = () => { state.sample = false; save(); route(); };
}

    </div>`);
}

function opts(list, sel, all){ return (all ? `<option value="">${T(all)}</option>` : "") + list.map(o => `<option value="${esc(o.id)}"${o.id === sel ? " selected" : ""}>${esc(o.budget !== undefined ? cname(o) : T(o.en))}</option>`).join(""); }

function renderExpenses(sec){
  sec.insertAdjacentHTML("beforeend", `
  <div class="toolbar">
    <button class="btn primary" id="addExp">${T("+ Add expense")}</button>
    <input class="grow" id="q" type="search" placeholder="${T("Search vendor or details")}" value="${esc(ui.q)}" aria-label="Search">
    <select id="fk" aria-label="Category" style="width:auto;max-width:100%">${opts(state.categories, ui.fk, "All categories")}</select>
    <select id="fst" aria-label="Status" style="width:auto">${opts([{id:"paid",en:"Paid"},{id:"unpaid",en:"Not fully paid"},{id:"overdue",en:"Overdue"}], ui.fst, "Any status")}</select>
  </div>
  <div id="expTable"></div>`);
  const draw = () => {
    const q = ui.q.toLowerCase();
    const list = state.expenses.filter(x =>
      (!ui.fk || x.category === ui.fk) &&
      (!ui.fst || (ui.fst === "paid" ? statusOf(x).k === "paid" : ui.fst === "overdue" ? statusOf(x).k === "overdue" : statusOf(x).k !== "paid")) &&
      (!q || (x.vendor + " " + x.desc + " " + x.notes).toLowerCase().includes(q))
    ).sort((a,b) => (b.date||"").localeCompare(a.date||""));
    const t = totals(list);
    $("#expTable").innerHTML = list.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>${T("Date")}</th><th>${T("Category")}</th><th>${esc(T("Vendor & details"))}</th><th class="r">${T("Amount")}</th><th class="r">${T("Paid")}</th><th class="r">${T("Balance")}</th><th>${T("Status")}</th><th></th></tr></thead>
      <tbody>${list.map(x => { const st = statusOf(x); return `<tr>
        <td class="num" style="white-space:nowrap">${fmtDate(x.date)}</td>
        <td>${esc(cname(cat(x.category)))}</td>
        <td class="desc"><b>${esc(x.vendor)}</b>${x.desc ? `<div class="muted">${esc(x.desc)}</div>` : ""}${x.notes ? `<div class="muted" style="font-size:14px">${esc(x.notes)}</div>` : ""}</td>
        <td class="r num">${inr(x.amount)}</td><td class="r num">${inr(x.paid)}</td><td class="r num">${inr(Math.max(0, x.amount - x.paid))}</td>
        <td><span class="pill ${st.k}">${T(st.t)}</span>${x.due && st.k !== "paid" ? `<div class="muted" style="font-size:13px;white-space:nowrap">${T("due")} ${fmtDate(x.due)}</div>` : ""}<div class="muted" style="font-size:13px">${esc(T(x.mode||""))}</div></td>
        <td><div class="row-actions">${st.k !== "paid" ? `<button class="btn small" data-pay="${x.id}">${T("Mark paid")}</button>` : ""}<button class="btn small" data-edit="${x.id}">${T("Edit")}</button><button class="btn small danger" data-del="${x.id}">${T("Delete")}</button></div></td></tr>`; }).join("")}</tbody>
      <tfoot><tr><td colspan="3">${list.length} ${lang === "gu" ? T("expenses") : "expense" + (list.length === 1 ? "" : "s")}</td><td class="r num">${inr(t.amount)}</td><td class="r num">${inr(t.paid)}</td><td class="r num">${inr(t.due)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>` : `<div class="panel empty">${state.expenses.length ? T("No expenses match these filters.") : T("No expenses yet. Add the first booking, for example the caterer's advance.")}</div>`;
  };
  draw();
  ["q","fk","fst"].forEach(id => $("#" + id).addEventListener("input", e => { ui[id] = e.target.value; keepUi(); draw(); }));
  $("#addExp").onclick = () => expenseForm();
  $("#expTable").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.edit) expenseForm(state.expenses.find(x => x.id === b.dataset.edit));
    if (b.dataset.pay) { const x = state.expenses.find(x => x.id === b.dataset.pay); x.paid = x.amount; save(); draw(); toast(T("Marked as paid") + ": " + (x.vendor || "")); }
    if (b.dataset.del) armDelete(b, () => { state.expenses = state.expenses.filter(x => x.id !== b.dataset.del); save(); draw(); toast(T("Expense deleted")); });
  });
}

function armDelete(btn, fn){
  if (btn.classList.contains("armed")) { fn(); return; }
  const orig = btn.textContent;
  btn.classList.add("armed"); btn.textContent = T("Confirm") + "?";
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = orig; } }, 3500);
}

function sheet(html, onReady){
  const layer = $("#layer");
  layer.innerHTML = `<div class="overlay" id="ov"><form class="sheet" id="sheetForm" novalidate>${html}</form></div>`;
  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") close(); });
  layer.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  onReady($("#sheetForm"), close);
  const first = layer.querySelector("input,select"); if (first) first.focus();
}

function expenseForm(x){
  const isNew = !x;
  x = x || {date:today(), category: ui.fk || "catering", vendor:"", desc:"", amount:"", paid:"", side:"groom", mode:"UPI", due:"", notes:""};
  sheet(`<h2>${isNew ? T("Add expense") : T("Edit expense")}</h2>
    <div class="form">
      <label>${T("Category")}<select id="f_category">${opts(state.categories, x.category)}</select></label>
      <label>${T("Vendor / paid to")}<input id="f_vendor" value="${esc(x.vendor)}" placeholder="${lang === "gu" ? "જેમ કે શ્રી અન્નપૂર્ણા કેટરર્સ" : "e.g. Shree Annapurna Caterers"}"></label>
      <label class="wide">${T("What for")}<input id="f_desc" value="${esc(x.desc)}" placeholder="${lang === "gu" ? "જેમ કે 300 મહેમાન માટે ગુજરાતી થાળી, લાઇવ ઢોકળા કાઉન્ટર" : "e.g. Gujarati thali for 300 guests, live dhokla counter"}"></label>
      <label>${T("Total amount (₹)")}<input id="f_amount" type="number" inputmode="numeric" min="0" step="1" value="${esc(x.amount)}" required></label>
      <label>${T("Paid so far (₹)")}<input id="f_paid" type="number" inputmode="numeric" min="0" step="1" value="${esc(x.paid)}" placeholder="0"></label>
      <div class="wide chips"><button type="button" class="chip" id="payFull">${T("Paid in full")}</button><button type="button" class="chip" id="payHalf">${T("50% advance")}</button><button type="button" class="chip" id="payNone">${T("Nothing paid yet")}</button></div>
      <label>${T("Payment mode")}<select id="f_mode">${MODES.map(m => `<option value="${m}"${m === x.mode ? " selected" : ""}>${T(m)}</option>`).join("")}</select></label>
      <label>${T("Date")}<input id="f_date" type="date" value="${esc(x.date)}"></label>
      <label>${T("Balance due by")}<input id="f_due" type="date" value="${esc(x.due)}"></label>
      <label class="wide">${T("Notes")}<textarea id="f_notes" placeholder="${lang === "gu" ? "રસીદ નંબર, સંપર્ક વ્યક્તિ, શું શામેલ છે" : "Receipt number, contact person, what is included"}">${esc(x.notes)}</textarea></label>
    </div>
    <p id="f_err" style="color:var(--kumkum);margin:0" hidden></p>
    <div class="foot"><button type="button" class="btn" data-close>${T("Cancel")}</button><button class="btn primary" type="submit">${isNew ? T("Add expense") : T("Save changes")}</button></div>`,
  (form, close) => {
    const amt = () => +$("#f_amount").value || 0;
    $("#payFull").onclick = () => $("#f_paid").value = amt();
    $("#payHalf").onclick = () => $("#f_paid").value = Math.round(amt() / 2);
    $("#payNone").onclick = () => $("#f_paid").value = 0;
    form.addEventListener("submit", e => {
      e.preventDefault();
      const rec = {};
      ["category","vendor","date","desc","amount","paid","due","mode","notes"].forEach(k => rec[k] = $("#f_" + k).value.trim());
      rec.side = "groom";
      rec.amount = +rec.amount || 0; rec.paid = +rec.paid || 0;
      const err = $("#f_err");
      if (!rec.amount) { err.textContent = T("Enter the total amount for this expense."); err.hidden = false; $("#f_amount").focus(); return; }
      if (!rec.vendor && !rec.desc) { err.textContent = T("Add a vendor name or what the expense is for, so you can find it later."); err.hidden = false; $("#f_vendor").focus(); return; }
      if (rec.paid > rec.amount) { err.textContent = T("Paid is more than the total. Check both amounts.") + ` (${inr(rec.paid)} > ${inr(rec.amount)})`; err.hidden = false; return; }
      if (isNew) state.expenses.push(Object.assign({id:uid()}, rec)); else Object.assign(x, rec);
      save(); close(); route(); toast(isNew ? T("Expense added") : T("Expense saved"));
    });
  });
}

function csv(rows){ return "﻿" + rows.map(r => r.map(v => { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(",")).join("\r\n"); }
function expensesCsv(){
  return csv([["Date","Category","Vendor","Details","Amount (INR)","Paid (INR)","Balance (INR)","Status","Due date","Payment mode","Notes"],
    ...state.expenses.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(x => [x.date, cname(cat(x.category)), x.vendor, x.desc, x.amount, x.paid, Math.max(0,x.amount-x.paid), statusOf(x).t, x.due, x.mode, x.notes])]);
}
function categoryCsv(){
  return csv([["Category","Budget (INR)","Booked (INR)","Paid (INR)","To pay (INR)","Left in budget (INR)"],
    ...state.categories.map(c => { const t = totals(state.expenses.filter(x => x.category === c.id)); return [c.en, c.budget, t.amount, t.paid, t.due, c.budget - t.amount]; })]);
}
function deliver(name, text, mime){
  if (!inFrame) {
    try {
      const url = URL.createObjectURL(new Blob([text], {type:mime}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); toast(T("Downloaded") + ": " + name); return;
    } catch(e) {}
  }
  sheet(`<h2>${esc(name)}</h2><p class="muted" style="margin:0">${T("Downloads are blocked in this preview. Copy the text below and paste it into a file named")} <b>${esc(name)}</b>, ${T("or open the GitHub Pages version to download directly.")}</p>
    <textarea id="exportText" readonly style="min-height:240px;font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea>
    <div class="foot"><button type="button" class="btn" data-close>${T("Close")}</button><button type="button" class="btn primary" id="copyExport">${T("Copy")}</button></div>`,
  () => { $("#copyExport").onclick = () => { const ta = $("#exportText"); try { navigator.clipboard.writeText(ta.value).then(() => toast(T("Copied")), () => { ta.select(); toast("Press Ctrl+C or ⌘C to copy"); }); } catch(e) { ta.select(); toast("Press Ctrl+C or ⌘C to copy"); } }; });
}

function renderSetup(sec){
  const s = state.settings, stamp = today();
  sec.insertAdjacentHTML("beforeend", `
  <div class="grid2">
    <div class="panel"><h2>${T("Wedding details")}</h2>
      <div class="form">
        <label>${T("Groom's name")}<input id="s_groom" value="${esc(s.groom)}"></label>
        <label>${T("Bride's name")}<input id="s_bride" value="${esc(s.bride)}"></label>
        <label>${T("Lagna date")}<input id="s_date" type="date" value="${esc(s.date)}"></label>
      </div>
    </div>
    <div class="panel"><h2>${T("Export")} <small>${T("opens in Excel or Google Sheets")}</small></h2>
      <div class="toolbar">
        <button class="btn" id="exExp">${T("Expenses (.csv)")}</button>
        <button class="btn" id="exCat">${T("Category summary (.csv)")}</button>
      </div>
      <h2 style="margin-top:18px">${T("Backup")} <small>${T("to move to another phone or laptop")}</small></h2>
      <div class="toolbar">
        <button class="btn primary" id="exJson">${T("Save backup (.json)")}</button>
        <label class="btn" for="imp" style="display:inline-block;color:var(--ink);font-size:17px">${T("Restore from backup")}<input type="file" id="imp" accept=".json,application/json" hidden></label>
      </div>
      <div id="impConfirm"></div>
      <p class="muted" style="font-size:15px;margin:10px 0 0">${T("Entries are saved in this browser only. Save a backup every few days, and before clearing browser data.")}</p>
    </div>
  </div>
  <div class="panel"><h2>${T("Categories")} <small>${state.categories.length}</small></h2>
    <div class="tbl-wrap"><table><tbody>${state.categories.map(c => { const used = state.expenses.some(x => x.category === c.id); return `<tr><td><input id="cn_${esc(c.id)}" data-cname="${esc(c.id)}" value="${esc(cname(c))}" aria-label="Category name"></td><td class="r" style="width:1%">${used ? '<span class="muted" style="font-size:13px;white-space:nowrap">' + T("in use") + '</span>' : `<button class="btn small danger" data-delk="${esc(c.id)}">${T("Remove")}</button>`}</td></tr>`; }).join("")}</tbody></table></div>
    <div class="toolbar" style="margin-top:10px"><input class="grow" id="newK" placeholder="${T("Add a category, e.g. Farsan & mithai boxes")}"><button class="btn" id="addK">${T("Add")}</button></div>
  </div>`);
  ["bride","groom","date"].forEach(k => $("#s_" + k).addEventListener("change", e => { state.settings[k] = e.target.value.trim(); save(); renderHeader(); toast(T("Saved")); }));
  $("#exExp").onclick = () => deliver(`wedding-expenses-${stamp}.csv`, expensesCsv(), "text/csv");
  $("#exCat").onclick = () => deliver(`category-summary-${stamp}.csv`, categoryCsv(), "text/csv");
  $("#exJson").onclick = () => deliver(`lagna-hisaab-backup-${stamp}.json`, JSON.stringify(state, null, 1), "application/json");
  $("#imp").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let p; try { p = JSON.parse(r.result); } catch(err) { toast(T("That file is not a Lagna Hisaab backup.")); return; }
      if (!p || !Array.isArray(p.expenses)) { toast(T("That file is not a Lagna Hisaab backup.")); return; }
      $("#impConfirm").innerHTML = `<div class="notice" style="margin-top:10px"><span>${T("Replace everything here with the backup?")} (${p.expenses.length})</span><span class="toolbar"><button class="btn small primary" id="impYes">${T("Replace")}</button><button class="btn small" id="impNo">${T("Cancel")}</button></span></div>`;
      $("#impYes").onclick = () => { p.sample = false; state = normalize(p); save(); route(); toast(T("Backup restored")); };
      $("#impNo").onclick = () => { $("#impConfirm").innerHTML = ""; e.target.value = ""; };
    };
    r.readAsText(f);
  });
  const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + uid().slice(0,3);
  $("#addK").onclick = () => { const v = $("#newK").value.trim(); if (!v) return; state.categories.splice(state.categories.length - 1, 0, {id:slug(v), en:v, gu:v, budget:0}); save(); route(); toast(T("Category added")); };
  sec.querySelectorAll("[data-cname]").forEach(inp => inp.addEventListener("change", () => { const v = inp.value.trim(); if (v) { cat(inp.dataset.cname)[lang === "gu" ? "gu" : "en"] = v; save(); toast(T("Renamed")); } }));
  sec.querySelectorAll("[data-delk]").forEach(b => b.onclick = () => armDelete(b, () => { state.categories = state.categories.filter(c => c.id !== b.dataset.delk); save(); route(); }));
}

route();
})();
</script>
</body>
</html>
