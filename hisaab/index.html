<style>
/* Layout: bandhani-dotted header band, tab bar, then one working view at a time (overview, expenses, budget, chandlo, setup). */
:root{
  --bg:#FBF3E4; --surface:#FFFAF1; --sunk:#F3E4C8; --ink:#33160F; --muted:#6A3C2A; --line:#E8D2AE;
  --kumkum:#7A1420; --kumkum-ink:#FBF3E4; --haldi:#9C6B23; --mehndi:#3D6B2C; --warn:#B4441A;
  --gold:#D9A84E; --gold-l:#F5D996;
  --band:#3D0910; --band-2:#7A1420; --band-dot:rgba(245,217,150,.18);
  --display:"Hind Vadodara","Noto Sans Gujarati","Shruti",system-ui,sans-serif; --brand:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Hind Vadodara","Noto Sans Gujarati","Shruti",system-ui,sans-serif;
  --guj:"Hind Vadodara","Noto Sans Gujarati","Shruti",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A0A0C; --surface:#26100F; --sunk:#200C0D; --ink:#F5E6DC; --muted:#CDAE94; --line:#4A2422;
  --kumkum:#E77A84; --kumkum-ink:#1A0A0C; --haldi:#D9A84E; --mehndi:#94C47E; --warn:#F09060;
  --gold:#D9A84E; --gold-l:#F5D996;
  --band:#2A0609; --band-2:#5A0F18; --band-dot:rgba(245,217,150,.14); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1A0A0C; --surface:#26100F; --sunk:#200C0D; --ink:#F5E6DC; --muted:#CDAE94; --line:#4A2422;
  --kumkum:#E77A84; --kumkum-ink:#1A0A0C; --haldi:#D9A84E; --mehndi:#94C47E; --warn:#F09060;
  --gold:#D9A84E; --gold-l:#F5D996;
  --band:#2A0609; --band-2:#5A0F18; --band-dot:rgba(245,217,150,.14); color-scheme:dark }
*{box-sizing:border-box}
.band h1{font-family:var(--brand)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;font-weight:500;line-height:1.45;margin:0;font-variant-numeric:lining-nums}
.gu,[lang="gu"]{font-family:var(--guj)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.02em;line-height:1.2;text-wrap:balance;margin:0}
.num{font-variant-numeric:lining-nums tabular-nums}
header.band{background-color:var(--band);background-image:radial-gradient(var(--band-dot) 1.4px,transparent 1.6px),linear-gradient(160deg,var(--band-2),var(--band));background-size:14px 14px,100% 100%;color:var(--gold-l);border-bottom:3px double var(--gold);
  margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 22px);padding-bottom:18px}
.band .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.band h1{font-size:32px;font-weight:600;color:#FBF3E4}
.band .invoc{font-family:var(--guj);font-size:15px;color:var(--gold);letter-spacing:.04em;margin-bottom:4px}
.band .gu{font-family:var(--guj);font-weight:500;color:var(--gold-l);font-size:18px;margin-left:8px}
.band p{margin:4px 0 0;color:var(--gold-l);font-size:17px}
.countdown{font-family:var(--display);text-align:right;font-size:15px;color:var(--gold-l);letter-spacing:.06em}
.cloudbadge{font-size:14px;color:var(--gold-l);margin-top:4px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.langbtn{font-family:var(--guj),var(--body);font-size:15px;font-weight:600;color:var(--gold-l);background:transparent;border:1px solid var(--gold);border-radius:999px;padding:4px 14px;cursor:pointer}
html[lang="gu"] .tile .lbl,html[lang="gu"] th,html[lang="gu"] nav.tabs a,html[lang="gu"] .countdown{font-family:var(--guj);font-size:15px;letter-spacing:.01em;text-transform:none}
html[lang="gu"] .panel h2,html[lang="gu"] .sheet h2{font-family:var(--guj);font-weight:600}
.langbtn:hover{background:rgba(217,168,78,.15)}
.countdown b{font-size:30px;display:block;line-height:1;color:#FBF3E4}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:12px 14px;color:var(--muted);text-decoration:none;font-family:var(--display);font-size:15px;letter-spacing:.05em;font-weight:600;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--kumkum);border-color:var(--kumkum)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
main{padding-block:20px 60px}
section.view{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
section.view>*{min-width:0}
.notice{background:var(--sunk);border:1px dashed var(--haldi);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:2px solid var(--gold)}
.tile .lbl{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--body);font-size:30px;font-weight:700;margin-top:2px;font-variant-numeric:lining-nums}
.tile .sub{font-size:15px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{font-family:var(--body);font-size:15px;letter-spacing:0;color:var(--muted);font-weight:500}
.bars{display:grid;gap:12px}
.bar-row .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar-row .top span:first-child{font-weight:600;min-width:0;overflow-wrap:anywhere}
.bar-row .top .gu{color:var(--muted);font-weight:400;margin-left:4px}
.track{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin-top:5px;overflow:hidden;border:1px solid var(--line)}
.track i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:5px}
.track i.paid{background:var(--mehndi)}
.track i.over{background:var(--kumkum)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:6px 0 10px}
.split i{display:block;height:100%}
.sched{display:grid;gap:0}
.sched .ev{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.sched .ev:last-child{border-bottom:0}
.sched .d{font-family:var(--display);font-size:14px;color:var(--kumkum);letter-spacing:.05em;line-height:1.3}
.sched .d b{display:block;font-size:20px}
.sched .n b{display:block}
.sched .n span{font-size:14px;color:var(--muted)}
@media (max-width:480px){.sched .ev{grid-template-columns:60px 1fr}.sched .ev .num{grid-column:2}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--sunk);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:var(--sunk);border-bottom:0}
tbody tr:last-child td{border-bottom:0}
td .muted,.muted{color:var(--muted)}
td.desc{min-width:180px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:15px;font-weight:600;white-space:nowrap;border:1px solid}
.pill.paid{color:var(--mehndi);border-color:var(--mehndi)}
.pill.partial{color:var(--haldi);border-color:var(--haldi)}
.pill.pending{color:var(--kumkum);border-color:var(--kumkum)}
.pill.overdue{background:var(--kumkum);color:var(--kumkum-ink);border-color:var(--kumkum)}
.side{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 200px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label{display:grid;gap:4px;font-size:15px;font-weight:600;color:var(--muted)}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--kumkum);border-color:var(--kumkum);color:var(--kumkum-ink)}
.btn.small{padding:4px 9px;font-size:15px}
.btn.danger{color:var(--kumkum)}
.btn.danger.armed{background:var(--kumkum);color:var(--kumkum-ink);border-color:var(--kumkum)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.form .wide{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,6,8,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:100%;max-width:720px;padding:18px;display:grid;gap:14px}
.sheet h2{font-size:22px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.ceremony-cell b{display:block}
.ceremony-cell span{font-size:14px;color:var(--muted)}
.tag{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--haldi)}
@media (max-width:560px){.band h1{font-size:25px}.tile .val{font-size:22px}.countdown{text-align:left}.hdr-right{align-items:flex-start;flex-direction:row-reverse;justify-content:space-between;width:100%}}

/* mobile-first: cards, bottom nav, floating add button, bottom sheet */
.sumbar{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;font-size:15px;color:var(--muted)}
.sumbar b{color:var(--ink)}
.xlist{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.xcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.xcard .who{min-width:0}
.xcard .who b{display:block;font-size:18px;overflow-wrap:anywhere;line-height:1.25}
.xcard .who span{font-size:14px;color:var(--muted)}
.xcard .amt{text-align:right;flex:none}
.xcard .amt b{font-size:21px;display:block;line-height:1.1}
.xcard .desc{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.xcard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px;color:var(--muted)}
.xcard .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.xcard .acts .btn{padding:7px 12px}
.catlist{display:grid;gap:0}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 2px;border-bottom:1px dashed var(--line);color:inherit;text-decoration:none}
.catrow:last-child{border-bottom:0}
.catrow .nm{font-weight:700;overflow-wrap:anywhere}
.catrow .tt{font-weight:700;text-align:right}
.catrow .track{grid-column:1/-1;margin-top:2px}
.catrow .sm{grid-column:1/-1;font-size:14px;color:var(--muted)}
.cattotal{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:2px solid var(--line);margin-top:4px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:8;
  min-height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--kumkum);color:var(--kumkum-ink);font:inherit;font-weight:700;font-size:18px;
  box-shadow:0 6px 18px rgba(61,9,16,.35);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab span{font-size:28px;line-height:1;margin-top:-3px}
main{padding-bottom:110px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .q{grid-column:1/-1}
@media (min-width:760px){
  .xlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:2fr 1fr 1fr}.filters .q{grid-column:auto}
}
@media (max-width:719px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 14px rgba(61,9,16,.08)}
  nav.tabs .wrap{justify-content:space-around;gap:0}
  nav.tabs a{flex:1;text-align:center;padding:14px 6px 12px;border-bottom:0;border-top:3px solid transparent;font-size:15px}
  nav.tabs a[aria-current="page"]{border-top-color:var(--kumkum)}
  .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  main{padding-bottom:160px;padding-top:14px}
  header.band{padding-bottom:14px;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tiles .tile:first-child{grid-column:1/-1}
  .tile{padding:12px 14px}
  .overlay{align-items:flex-end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-width:none;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));max-height:92vh;overflow-y:auto}
  .sheet .foot{position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 16px));background:var(--surface);padding-block:10px;margin-bottom:calc(-1 * (env(safe-area-inset-bottom,0px) + 16px))}
  .sheet .foot .btn{flex:1;padding:12px}
}
.flbl{font-size:15px;font-weight:600;color:var(--muted)}
.catpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cpk{font:inherit;font-size:14px;font-weight:600;line-height:1.25;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer;min-height:44px;text-align:left}
.cpk[aria-pressed="true"]{background:var(--kumkum);border-color:var(--kumkum);color:var(--kumkum-ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:inherit;font-size:15px;font-weight:700;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer;padding:6px}
.seg button[aria-pressed="true"]{background:var(--mehndi);border-color:var(--mehndi);color:var(--kumkum-ink)}
.amtin{font-size:28px;font-weight:700;padding:10px 12px}
.chip{padding:7px 12px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s ease}}

/* Easy-tap UI: big targets, clear primary action, tap feedback */
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border-width:1.5px;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;touch-action:manipulation;transition:transform .08s ease,box-shadow .15s ease}
.btn:active,.chip:active,.seg button:active,.fab:active,nav.tabs a:active,.catrow:active{transform:scale(.97)}
.btn.primary{box-shadow:0 3px 10px rgba(122,20,32,.25)}
.btn.small{min-height:42px;padding:8px 14px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{min-height:42px;padding:8px 14px;font-size:16px;font-weight:600;display:inline-flex;align-items:center}
.seg button{min-height:56px;font-size:16px}
input,select,textarea{min-height:50px;font-size:17px;border-width:1.5px;border-radius:12px;padding:10px 12px}
textarea{min-height:90px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
label{font-weight:600}
.xcard .acts .btn{min-height:44px;padding:8px 16px}
.fab{min-height:60px;font-size:19px;padding:0 24px}
nav.tabs a::before{display:block;font-size:22px;line-height:1.1;margin-bottom:2px}
nav.tabs a[href="#overview"]::before{content:"🏠"}
nav.tabs a[href="#expenses"]::before{content:"🧾"}
nav.tabs a[href="#history"]::before{content:"🕘"}
nav.tabs a[href="#setup"]::before{content:"⚙️"}
@media (min-width:720px){nav.tabs a::before{display:inline;font-size:16px;margin:0 6px 0 0}}
nav.tabs a{font-size:15px;font-weight:700}
nav.tabs a[aria-current="page"]{background:color-mix(in srgb,var(--kumkum) 8%,transparent)}
@media (max-width:719px){main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px)) !important}}
.confirm-ov{position:fixed;inset:0;z-index:40;background:rgba(20,6,8,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.confirm{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:420px;display:grid;gap:14px;box-shadow:0 12px 40px rgba(20,6,8,.35)}
.confirm h3{font-size:21px;font-family:var(--body);font-weight:700}
.confirm .cfb{display:grid;gap:4px;font-size:17px;color:var(--muted)}
.confirm .cff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm .cff .btn{min-height:52px;white-space:normal}
.btn.danger-fill{background:var(--kumkum);border-color:var(--kumkum);color:var(--kumkum-ink)}
</style>

<body>

<header class="band">
  <div class="wrap">
    <div>
      <div class="invoc" lang="gu">|| શ્રી ગણેશાય નમઃ ||</div>
      <h1 id="hdrTitle">Deep &amp; Hinal <span class="gu">દીપ &amp; હિનલ</span></h1>
      <p id="hdrSub">Lagna Hisaab · લગ્ન હિસાબ</p>

}

// one-time confirm popup: askConfirm({title, body, ok, danger}).then(yes => ...)
function askConfirm({title, body = "", ok = T("Yes"), danger = false}){
  return new Promise(res => {
    const d = document.createElement("div");
    d.className = "confirm-ov";
    d.innerHTML = `<div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="cfT"><h3 id="cfT">${esc(title)}</h3>${body ? `<div class="cfb">${body}</div>` : ""}<div class="cff"><button type="button" class="btn" data-no>${T("No, go back")}</button><button type="button" class="btn primary${danger ? " danger-fill" : ""}" data-yes>${esc(ok)}</button></div></div>`;
    const done = v => { d.remove(); document.removeEventListener("keydown", key, true); res(v); };
    const key = e => { if (e.key === "Escape") { e.stopPropagation(); done(false); } };
    document.addEventListener("keydown", key, true);
    d.addEventListener("click", e => { if (e.target === d) done(false); });
    d.querySelector("[data-no]").onclick = () => done(false);
    d.querySelector("[data-yes]").onclick = () => done(true);
    document.body.appendChild(d); d.querySelector("[data-yes]").focus();
  });
}
function armDelete(btn, fn, body){
  askConfirm({title: T("Delete this?"), body: body || T("This cannot be undone."), ok: T("Yes, delete"), danger: true}).then(y => { if (y) fn(); });
}

function sheet(html, onReady){
  const layer = $("#layer");
  layer.innerHTML = `<div class="overlay" id="ov"><form class="sheet" id="sheetForm" novalidate>${html}</form></div>`;
  const close = () => { layer.innerHTML = ""; document.removeEventListener("keydown", onKey); if (rerenderPending) { rerenderPending = false; setTimeout(() => { const y = scrollY; route(); scrollTo(0, y); }, 0); } };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") close(); });
  layer.querySelectorAll("[data-close]").forEach(b => b.onclick = close);
  onReady($("#sheetForm"), close);
  const first = layer.querySelector("input,select"); if (first) first.focus();
}

// accepts 220000, 2,20,000, ₹2,20,000, Gujarati ૨૨૦૦૦૦ or Hindi २२०००० digits
function parseAmt(v){
  const s = String(v || "").replace(/[\u0AE6-\u0AEF]/g, d => d.charCodeAt(0) - 0x0AE6).replace(/[\u0966-\u096F]/g, d => d.charCodeAt(0) - 0x0966).replace(/[^0-9.]/g, "");
  return Math.max(0, Math.round(parseFloat(s) || 0));
}
function expenseForm(x){
  const isNew = !x;
  x = x || {date:today(), category: ui.fk || "", vendor:"", desc:"", amount:"", paid:"", side:"groom", mode:"", due:"", notes:""};
  let pay = isNew ? "full" : (x.paid >= x.amount && x.amount ? "full" : x.paid > 0 ? "part" : "none");
  sheet(`<h2>${isNew ? T("Add expense") : T("Edit expense")}</h2>
    <label>${T("Amount (₹)")}<input id="f_amount" class="amtin num" type="text" inputmode="numeric" autocomplete="off" value="${x.amount ? esc(inr(x.amount).replace("₹", "")) : ""}" placeholder="0"></label>
    <label>${T("Category")}<select id="f_cat"><option value="">${T("Choose (optional, else Other)")}</option>${state.categories.map(c => `<option value="${esc(c.id)}" ${c.id === x.category ? "selected" : ""}>${esc(cname(c))}</option>`).join("")}</select></label>
    <label>${T("Paid to")}<input id="f_vendor" value="${esc(x.vendor)}" placeholder="${lang === "gu" ? "જેમ કે ઢોલવાળા, કેટરર" : "e.g. dhol, caterer"}" autocomplete="off"></label>
    <div style="display:grid;gap:6px"><span class="flbl">${T("Payment")}</span>
      <div class="seg" id="f_pay">${[["full","Paid in full"],["part","Part paid"],["none","Not paid yet"]].map(([k,l]) => `<button type="button" data-p="${k}" aria-pressed="${k === pay}">${T(l)}</button>`).join("")}</div>
      <label id="f_partwrap" ${pay === "part" ? "" : "hidden"}>${T("Paid so far (₹)")}<input id="f_paid" class="num" type="text" inputmode="numeric" autocomplete="off" value="${pay === "part" && x.paid ? esc(inr(x.paid).replace("₹", "")) : ""}" placeholder="0"></label></div>
    <p id="f_err" style="color:var(--kumkum);margin:0" hidden></p>
    <div class="foot"><button type="button" class="btn" data-close>${T("Cancel")}</button><button class="btn primary" type="submit">${isNew ? T("Save") : T("Save changes")}</button></div>`,
  (form, close) => {
    ["#f_amount", "#f_paid"].forEach(q => $(q).addEventListener("blur", e => { const v = parseAmt(e.target.value); e.target.value = v ? inr(v).replace("₹", "") : ""; }));
    form.querySelectorAll("#f_pay button").forEach(b => b.onclick = () => { pay = b.dataset.p; form.querySelectorAll("#f_pay button").forEach(o => o.setAttribute("aria-pressed", o === b)); $("#f_partwrap").hidden = pay !== "part"; if (pay === "part") $("#f_paid").focus(); });
    form.addEventListener("submit", e => {
      e.preventDefault();
      const err = $("#f_err"), fail = (m, el) => { err.textContent = m; err.hidden = false; if (el) el.focus(); };
      const amount = parseAmt($("#f_amount").value);
      if (!amount) return fail(T("Enter the amount."), $("#f_amount"));
      const catSel = $("#f_cat").value || (state.categories.some(c => c.id === "other") ? "other" : state.categories[state.categories.length - 1].id);
      const paid = pay === "full" ? amount : pay === "none" ? 0 : parseAmt($("#f_paid").value);
      if (paid > amount) return fail(T("Paid is more than the total. Check both amounts.") + ` (${inr(paid)} > ${inr(amount)})`, $("#f_paid"));
      const rec = {amount, paid, category:catSel, vendor:$("#f_vendor").value.trim(), side:"groom"};
      if (isNew) { const nx = Object.assign({id:uid(), by:who, at:new Date().toISOString(), date:today(), desc:"", mode:"", due:"", notes:""}, rec); state.expenses.push(nx); cloudPutExpense(nx); logH("added", nx); }
      else {
        const chl = ["amount","paid","vendor","category"].filter(k => String(x[k] ?? "") !== String(rec[k] ?? "")).map(k => k === "amount" || k === "paid" ? `${T(k === "amount" ? "Amount" : "Paid")}: ${inr(x[k])} → ${inr(rec[k])}` : k === "category" ? `${T("Category")}: ${cname(cat(x.category))} → ${cname(cat(rec.category))}` : `${T("Paid to")}: ${x[k] || "–"} → ${rec[k] || "–"}`);
        if (!chl.length) { close(); return; }
        askConfirm({title: T("Save these changes?"), body: chl.map(c => `<div>${esc(c)}</div>`).join(""), ok: T("Yes, save")}).then(y => {
          if (!y) return;
          Object.assign(x, rec); cloudPutExpense(x); logH("edited", x, chl.join("; "));
          save(); close(); route(); toast(T("Expense saved"));
        });
        return;
      }
      save(); close(); route(); toast(isNew ? T("Expense added") : T("Expense saved"));
    });
  });
}

function deliver(name, text, mime){
  if (!inFrame) {
    try {
      const url = URL.createObjectURL(new Blob([text], {type:mime}));
      const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); toast(T("Downloaded") + ": " + name); return;
    } catch(e) {}
  }
  sheet(`<h2>${esc(name)}</h2><p class="muted" style="margin:0">${T("Downloads are blocked in this preview. Copy the text below and paste it into a file named")} <b>${esc(name)}</b>, ${T("or open the GitHub Pages version to download directly.")}</p>
    <textarea id="exportText" readonly style="min-height:240px;font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea>
    <div class="foot"><button type="button" class="btn" data-close>${T("Close")}</button><button type="button" class="btn primary" id="copyExport">${T("Copy")}</button></div>`,
  () => { $("#copyExport").onclick = () => { const ta = $("#exportText"); try { navigator.clipboard.writeText(ta.value).then(() => toast(T("Copied")), () => { ta.select(); toast("Press Ctrl+C or ⌘C to copy"); }); } catch(e) { ta.select(); toast("Press Ctrl+C or ⌘C to copy"); } }; });
}

  $("#addK").onclick = () => { const v = $("#newK").value.trim(); if (!v) return; state.categories.splice(state.categories.length - 1, 0, {id:slug(v), en:v, gu:v, budget:0}); cloudPutMeta(); save(); route(); toast(T("Category added")); };
  sec.querySelectorAll("[data-cname]").forEach(inp => inp.addEventListener("change", () => { const v = inp.value.trim(); if (v) { cat(inp.dataset.cname)[lang === "gu" ? "gu" : "en"] = v; cloudPutMeta(); save(); toast(T("Renamed")); } }));
  sec.querySelectorAll("[data-delk]").forEach(b => b.onclick = () => armDelete(b, () => { state.categories = state.categories.filter(c => c.id !== b.dataset.delk); cloudPutMeta(); save(); route(); }));
}

route();
startCloud();
})();
</script>
</body>
</html>
